<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroScan v1.0 | LMK Research</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #0b0f1a;
            --card: rgba(23, 31, 50, 0.8);
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: white;
            margin: 0; min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background-image: radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                              radial-gradient(circle at 100% 100%, rgba(168, 85, 247, 0.15) 0%, transparent 50%);
        }
        #app {
            width: 100%; max-width: 500px;
            padding: 40px; border-radius: 32px;
            background: var(--card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            text-align: center;
        }
        .header { margin-bottom: 40px; }
        .header h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; margin: 0; background: linear-gradient(to right, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { font-size: 0.85rem; opacity: 0.5; margin-top: 8px; }

        /* Custom Slider */
        .slider-container { margin: 30px 0; text-align: left; }
        .slider-label { font-size: 0.9rem; font-weight: 600; margin-bottom: 15px; display: block; color: rgba(255,255,255,0.9); }
        input[type="range"] {
            -webkit-appearance: none; width: 100%; height: 6px;
            background: rgba(255,255,255,0.1); border-radius: 10px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 20px; height: 20px;
            background: var(--primary); border-radius: 50%; cursor: pointer;
            box-shadow: 0 0 15px var(--primary);
        }

        /* Choice Chips (Thay thế cho Select) */
        .chip-group { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .chip {
            padding: 10px 18px; border-radius: 12px;
            background: rgba(255,255,255,0.05); border: 1px solid var(--border);
            font-size: 0.85rem; cursor: pointer; font-weight: 500;
        }
        .chip.active { background: var(--primary); border-color: var(--primary); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }

        .btn-main {
            margin-top: 30px; width: 100%; padding: 16px;
            border-radius: 16px; border: none;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white; font-weight: 700; font-size: 1rem;
            cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .btn-main:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(99, 102, 241, 0.4); }

        /* Test Area */
        .stroop-word { font-size: 4.5rem; font-weight: 800; margin: 40px 0; text-shadow: 0 0 20px rgba(255,255,255,0.1); }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .opt-btn {
            padding: 20px; border-radius: 20px; border: 1px solid var(--border);
            background: rgba(255,255,255,0.03); color: white; font-weight: 700;
            cursor: pointer; font-size: 1rem;
        }
        .opt-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }

        .hidden { display: none; }
        .progress-container { width: 100%; height: 4px; background: rgba(255,255,255,0.05); border-radius: 10px; margin-bottom: 30px; overflow: hidden; }
        #progress-bar { height: 100%; background: var(--primary); width: 0%; }
    </style>
</head>
<body>

<div id="app">
    <div class="header">
        <h1>NEURO-SCAN AI</h1>
        <p>PROJECT BRAIN ROT | LÊ QUÝ ĐÔN SPECIALIZED SCHOOL</p>
    </div>

    <div id="screen-survey">
        <div class="slider-container">
            <span class="slider-label">Mức độ tiêu thụ Video ngắn (Giờ/Ngày)</span>
            <input type="range" id="usage-range" min="0" max="10" step="0.5" value="2">
            <div style="text-align: right; margin-top: 10px; font-weight: 800; color: var(--primary);"><span id="usage-val">2</span>h</div>
        </div>

        <div class="slider-container">
            <span class="slider-label">Tốc độ lướt (Behavioral Speed)</span>
            <div class="chip-group" id="scroll-chips">
                <div class="chip active" data-val="1">Chậm / Kỹ</div>
                <div class="chip" data-val="2">Vừa phải</div>
                <div class="chip" data-val="3">Nhanh</div>
                <div class="chip" data-val="4">Siêu nhanh</div>
            </div>
        </div>

        <div class="slider-container">
            <span class="slider-label">Mức độ duy trì tập trung (Deep Work)</span>
            <div class="chip-group" id="focus-chips">
                <div class="chip" data-val="1">Kém</div>
                <div class="chip" data-val="2">Trung bình</div>
                <div class="chip active" data-val="3">Tốt</div>
                <div class="chip" data-val="4">Xuất sắc</div>
            </div>
        </div>

        <button class="btn-main" onclick="startAnalysis()">BẮT ĐẦU PHÂN TÍCH</button>
    </div>

    <div id="screen-test" class="hidden">
        <div class="progress-container"><div id="progress-bar"></div></div>
        <p style="font-size: 0.8rem; opacity: 0.6;">CHỈ CHỌN MÀU SẮC, BỎ QUA CHỮ</p>
        <div id="stroop-word" class="stroop-word">---</div>
        <div class="options-grid" id="options-grid"></div>
    </div>

    <div id="screen-result" class="hidden">
        <div id="result-content">
            <div style="font-size: 3rem; margin-bottom: 20px;">⚡</div>
            <h3>PHÂN TÍCH HOÀN TẤT</h3>
            <p id="feedback-text" style="font-size: 0.9rem; opacity: 0.7; line-height: 1.6;"></p>
            <div id="stat-box" style="margin-top: 25px; padding: 20px; background: rgba(255,255,255,0.05); border-radius: 20px;"></div>
        </div>
        <button class="btn-main" onclick="location.reload()" style="background: rgba(255,255,255,0.1);">LÀM LẠI</button>
    </div>
</div>

<script>
    const colors = [
        { n: "ĐỎ", v: "#ff4757" }, { n: "XANH", v: "#2e86de" },
        { n: "LÁ", v: "#2ecc71" }, { n: "VÀNG", v: "#ffa502" }
    ];
    let current = 0, max = 12, results = [], startTime, scrollVal = 1, focusVal = 3;

    // Chips Logic
    document.querySelectorAll('.chip-group').forEach(group => {
        group.addEventListener('click', e => {
            if(e.target.classList.contains('chip')) {
                group.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                if(group.id === 'scroll-chips') scrollVal = e.target.dataset.val;
                if(group.id === 'focus-chips') focusVal = e.target.dataset.val;
            }
        });
    });

    document.getElementById('usage-range').oninput = function() { document.getElementById('usage-val').innerText = this.value; }

    function startAnalysis() {
        document.getElementById('screen-survey').classList.add('hidden');
        document.getElementById('screen-test').classList.remove('hidden');
        runTrial();
    }

    function runTrial() {
        if(current >= max) { finish(); return; }
        document.getElementById('progress-bar').style.width = (current/max*100) + "%";
        
        const txtIdx = Math.floor(Math.random()*colors.length);
        let colIdx; do { colIdx = Math.floor(Math.random()*colors.length); } while(colIdx === txtIdx);
        
        const display = document.getElementById('stroop-word');
        display.innerText = colors[txtIdx].n;
        display.style.color = colors[colIdx].v;

        const grid = document.getElementById('options-grid');
        grid.innerHTML = '';
        [...colors].sort(() => Math.random()-0.5).forEach(c => {
            const b = document.createElement('button');
            b.className = 'opt-btn';
            b.innerText = c.n;
            b.onclick = () => {
                results.push({ ok: c.v === colors[colIdx].v, rt: Date.now()-startTime });
                current++; runTrial();
            };
            grid.appendChild(b);
        });
        startTime = Date.now();
    }

    async function finish() {
        document.getElementById('screen-test').classList.add('hidden');
        document.getElementById('screen-result').classList.remove('hidden');
        
        const avgRT = results.reduce((a,b)=>a+b.rt,0)/max;
        const acc = (results.filter(r=>r.ok).length/max)*100;
        
        document.getElementById('stat-box').innerHTML = `
            <div style="display:flex; justify-content:space-between; margin-bottom:10px"><span>Độ nhạy:</span><b>${avgRT.toFixed(0)}ms</b></div>
            <div style="display:flex; justify-content:space-between"><span>Chính xác:</span><b>${acc.toFixed(0)}%</b></div>
        `;
        document.getElementById('feedback-text').innerText = "Dữ liệu đang được đồng bộ với mô hình K-Means của hệ thống...";

        // GỬI DATA (Khôi nhớ thay URL của bạn nhé)
        const scriptURL = 'URL_CỦA_BẠN';
        try {
            await fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify({
                    usage: document.getElementById('usage-range').value,
                    avgRT: avgRT.toFixed(0),
                    accuracy: acc.toFixed(0),
                    scroll: scrollVal,
                    focus: focusVal
                })
            });
            document.getElementById('feedback-text').innerText = "Phân tích hoàn tất. Dữ liệu của bạn đã đóng góp vào nghiên cứu Brain Rot tại Lê Quý Đôn.";
        } catch(e) { document.getElementById('feedback-text').innerText = "Đã lưu kết quả offline (Lỗi kết nối Server)."; }
    }
</script>
</body>
</html>
