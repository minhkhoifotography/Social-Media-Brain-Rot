<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroScan AI | Trợ lý Hồi phục Nhận thức</title>
    <style>
        :root { --p: #6366f1; --bg: #030712; --glass: rgba(17, 24, 39, 0.9); }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: white; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        
        #app { width: 100%; max-width: 500px; padding: 30px; border-radius: 30px; background: var(--glass); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); position: relative; }
        
        /* Loading Screen */
        .loader { width: 50px; height: 50px; border: 3px solid var(--p); border-top-color: transparent; border-radius: 50%; animation: spin 1s infinite; margin: 20px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Chat Interface */
        .chat-container { height: 350px; overflow-y: auto; background: rgba(0,0,0,0.2); border-radius: 20px; padding: 15px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 0.9rem; line-height: 1.4; }
        .bot { background: var(--p); color: white; align-self: flex-start; border-bottom-left-radius: 2px; }
        .user { background: rgba(255,255,255,0.1); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }

        .suggestion-box { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        .suggest-btn { background: rgba(99, 102, 241, 0.2); border: 1px solid var(--p); color: white; padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; cursor: pointer; }

        .input-area { display: flex; gap: 10px; }
        .chat-input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; color: white; outline: none; }
        .send-btn { background: var(--p); border: none; border-radius: 12px; padding: 0 15px; cursor: pointer; color: white; font-weight: bold; }

        .hidden { display: none; }
        .btn-main { width: 100%; padding: 15px; border-radius: 15px; border: none; background: var(--p); color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="app">
    <div id="screen-loading">
        <div class="loader"></div>
        <h3 id="load-text" style="color:var(--p)">ĐANG KHỞI TẠO...</h3>
        <p id="info-box" style="font-size: 0.85rem; opacity: 0.7; line-height: 1.6;"></p>
    </div>

    <div id="screen-main" class="hidden">
        <h2 style="margin:0">NeuroScan AI</h2>
        <p style="font-size: 0.7rem; color:var(--p); margin-bottom: 20px;">DỰ ÁN NGHIÊN CỨU LÊ QUÝ ĐÔN</p>
        <div style="text-align: left; margin-bottom: 15px;">
            <label style="font-size: 0.8rem; opacity:0.6">Thời gian dùng Reels/TikTok (giờ/ngày):</label>
            <input type="range" id="usage" min="0" max="10" step="1" value="3" style="width:100%">
            <div style="text-align: right; color:var(--p); font-weight: bold;"><span id="u-val">3</span>h</div>
        </div>
        <button class="btn-main" onclick="startTest()">BẮT ĐẦU CHẨN ĐOÁN</button>
    </div>

    <div id="screen-test" class="hidden">
        <div id="word" style="font-size: 3.5rem; font-weight: 900; margin: 30px 0;">---</div>
        <div id="options" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;"></div>
    </div>

    <div id="screen-result" class="hidden">
        <div style="background: rgba(99, 102, 241, 0.1); padding: 15px; border-radius: 15px; margin-bottom: 15px; border-left: 4px solid var(--p);">
            <div id="score-label" style="font-weight: 800; font-size: 1.1rem;">Brain Score: --%</div>
        </div>

        <div class="chat-container" id="chat-box">
            </div>

        <div class="suggestion-box" id="suggestions"></div>

        <div class="input-area">
            <input type="text" id="user-input" class="chat-input" placeholder="Hỏi tôi bất cứ điều gì...">
            <button class="send-btn" onclick="handleUserInput()">GỬI</button>
        </div>
    </div>
</div>

<script>
    // 1. MÀN HÌNH CHỜ & KIẾN THỨC (Dựa trên báo cáo)
    const facts = [
        "Brain Rot là hiện tượng suy giảm nhận thức do tiếp xúc quá mức với nội dung số ngắn.",
        "Thuật toán của chúng tôi lượng hóa Brain Score dựa trên thời gian thực tế và phản xạ thần kinh.",
        "Mục tiêu dự án: Đề xuất giải pháp can thiệp thói quen số cho giới trẻ Khánh Hòa."
    ];
    let fIdx = 0;
    function runFacts() {
        if(fIdx < facts.length) {
            document.getElementById('info-box').innerText = facts[fIdx++];
            setTimeout(runFacts, 1800);
        } else {
            document.getElementById('screen-loading').classList.add('hidden');
            document.getElementById('screen-main').classList.remove('hidden');
        }
    }
    runFacts();

    // 2. LOGIC TEST STROOP
    const colors = [{n:"ĐỎ",v:"#ff4757"}, {n:"XANH",v:"#2e86de"}, {n:"LÁ",v:"#2ecc71"}, {n:"VÀNG",v:"#ffa502"}];
    let results = [], current = 0, total = 10, startTime, finalScore = 0;

    document.getElementById('usage').oninput = function() { document.getElementById('u-val').innerText = this.value; }

    function startTest() {
        document.getElementById('screen-main').classList.add('hidden');
        document.getElementById('screen-test').classList.remove('hidden');
        next();
    }

    function next() {
        if(current >= total) { finalize(); return; }
        const tIdx = Math.floor(Math.random()*colors.length);
        let cIdx; do { cIdx = Math.floor(Math.random()*colors.length); } while(cIdx === tIdx);
        const d = document.getElementById('word');
        d.innerText = colors[tIdx].n; d.style.color = colors[cIdx].v;
        const g = document.getElementById('options'); g.innerHTML = '';
        [...colors].sort(()=>Math.random()-0.5).forEach(c => {
            const b = document.createElement('button');
            b.style.padding = "15px"; b.style.borderRadius = "12px"; b.style.border = "none";
            b.innerText = c.n; b.style.fontWeight = "bold";
            b.onclick = () => { results.push({ok: c.v === colors[cIdx].v, rt: Date.now()-startTime}); current++; next(); };
            g.appendChild(b);
        });
        startTime = Date.now();
    }

    // 3. LOGIC CHATBOT TỰ ĐỘNG
    function addMsg(text, type) {
        const box = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerText = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    const kb = {
        "dopamine": "Dopamine là chất dẫn truyền thần kinh tạo cảm giác hưng phấn. Video ngắn tạo ra 'vòng lặp dopamine' khiến bạn nghiện và giảm khả năng tập trung sâu.",
        "pomodoro": "Kỹ thuật Pomodoro (học 25p, nghỉ 5p) giúp não bộ hồi phục khả năng tập trung sau khi bị 'Brain Rot'.",
        "detox": "Digital Detox là việc ngắt kết nối hoàn toàn với mạng xã hội trong 24-48h để 'reset' lại hệ thống thưởng của não bộ.",
        "nguyên nhân": "Nguyên nhân chính là thuật toán cá nhân hóa nội dung quá nhanh, khiến não không có thời gian xử lý thông tin sâu."
    };

    function finalize() {
        document.getElementById('screen-test').classList.add('hidden');
        document.getElementById('screen-result').classList.remove('hidden');

        const avgRT = results.reduce((a,b)=>a+b.rt,0)/total;
        const acc = (results.filter(r=>r.ok).length/total)*100;
        const use = document.getElementById('usage').value;

        finalScore = Math.min(100, Math.round((use * 8) + (avgRT/20) + (100-acc)));
        document.getElementById('score-label').innerText = `Chỉ số Brain Rot: ${finalScore}%`;

        addMsg(`Chào bạn, tôi đã phân tích xong. Chỉ số của bạn là ${finalScore}%.`, 'bot');
        
        if(finalScore > 50) {
            addMsg("Bạn đang có dấu hiệu suy giảm nhận thức nhẹ. Bạn muốn tôi tư vấn cách hồi phục không?", 'bot');
            showSuggestions(["Cách hồi phục?", "Dopamine là gì?", "Kỹ thuật Pomodoro"]);
        } else {
            addMsg("Kết quả của bạn khá tốt! Hãy duy trì thói quen lành mạnh nhé.", 'bot');
            showSuggestions(["Tại sao tôi bị nghiện?", "Cách đọc sách sâu"]);
        }
    }

    function showSuggestions(list) {
        const box = document.getElementById('suggestions');
        box.innerHTML = '';
        list.forEach(item => {
            const b = document.createElement('button');
            b.className = 'suggest-btn';
            b.innerText = item;
            b.onclick = () => { addMsg(item, 'user'); processAI(item); };
            box.appendChild(b);
        });
    }

    function processAI(input) {
        const text = input.toLowerCase();
        let response = "Tôi chưa hiểu ý bạn, bạn có thể hỏi về Dopamine, Pomodoro hoặc Digital Detox nhé!";
        
        for (let key in kb) {
            if (text.includes(key)) { response = kb[key]; break; }
        }
        
        setTimeout(() => addMsg(response, 'bot'), 600);
    }

    function handleUserInput() {
        const input = document.getElementById('user-input');
        if(!input.value) return;
        addMsg(input.value, 'user');
        processAI(input.value);
        input.value = '';
    }
</script>
</body>
</html>
