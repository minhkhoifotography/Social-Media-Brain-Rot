<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Rot Research Tool | LMK Project</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --text: #1e293b;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        #app { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); width: 90%; max-width: 500px; text-align: center; }
        .hidden { display: none; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 1rem; transition: 0.3s; margin-top: 1rem; }
        .btn:hover { opacity: 0.9; }
        .stroop-word { font-size: 3rem; font-weight: bold; margin: 2rem 0; height: 80px; }
        .options { display: grid; grid-template-columns: 1-1; gap: 10px; margin-top: 1rem; }
        .color-btn { border: 2px solid #e2e8f0; padding: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        progress { width: 100%; height: 10px; border-radius: 5px; }
    </style>
</head>
<body>

<div id="app">
    <div id="screen-survey">
        <h2>Khảo sát Hành vi</h2>
        <p>Bạn dành bao nhiêu tiếng cho Video ngắn (TikTok/Reels) mỗi ngày?</p>
        <input type="range" id="usage-range" min="0" max="10" step="1" value="2" style="width:100%">
        <p><span id="usage-val">2</span> giờ</p>
        <button class="btn" onclick="startTest()">Bắt đầu Test Nhận Thức</button>
    </div>

    <div id="screen-test" class="hidden">
        <p>Chọn <b>MÀU SẮC</b> của chữ, không phải đọc chữ!</p>
        <progress id="test-progress" value="0" max="10"></progress>
        <div id="stroop-display" class="stroop-word"></div>
        <div class="options" id="color-options"></div>
    </div>

    <div id="screen-result" class="hidden">
        <h2>Kết quả của bạn</h2>
        <div id="final-stats" style="text-align: left; margin: 1rem 0;"></div>
        <button class="btn" onclick="location.reload()">Làm lại</button>
    </div>
</div>

<script>
    const colors = [
        { name: "ĐỎ", value: "#ff0000" },
        { name: "XANH DƯƠNG", value: "#0000ff" },
        { name: "XANH LÁ", value: "#008000" },
        { name: "VÀNG", value: "#facc15" }
    ];

    let currentTrial = 0;
    const maxTrials = 10;
    let results = [];
    let startTime;

    // Cập nhật hiển thị giờ
    document.getElementById('usage-range').oninput = function() {
        document.getElementById('usage-val').innerText = this.value;
    }

    function startTest() {
        document.getElementById('screen-survey').classList.add('hidden');
        document.getElementById('screen-test').classList.remove('hidden');
        nextTrial();
    }

    function nextTrial() {
        if (currentTrial >= maxTrials) {
            showResults();
            return;
        }

        const display = document.getElementById('stroop-display');
        const options = document.getElementById('color-options');
        options.innerHTML = '';

        // Tạo sự xung đột (Incongruent)
        const textIdx = Math.floor(Math.random() * colors.length);
        let colorIdx;
        do { colorIdx = Math.floor(Math.random() * colors.length); } while (colorIdx === textIdx);

        display.innerText = colors[textIdx].name;
        display.style.color = colors[colorIdx].value;

        // Tạo nút bấm
        colors.forEach((c, index) => {
            const btn = document.createElement('div');
            btn.className = 'color-btn';
            btn.innerText = c.name;
            btn.onclick = () => handleAnswer(colorIdx === index);
            options.appendChild(btn);
        });

        startTime = Date.now();
        document.getElementById('test-progress').value = currentTrial;
    }

    function handleAnswer(isCorrect) {
        const responseTime = Date.now() - startTime;
        results.push({ isCorrect, responseTime });
        currentTrial++;
        nextTrial();
    }

        function showResults() {
    document.getElementById('screen-test').classList.add('hidden');
    document.getElementById('screen-result').classList.remove('hidden');

    const avgRT = results.reduce((a, b) => a + b.responseTime, 0) / maxTrials;
    const accuracy = (results.filter(r => r.isCorrect).length / maxTrials) * 100;
    const usage = document.getElementById('usage-range').value;
    
    let advice = (avgRT > 1000 || accuracy < 80) ? "Cảnh báo Brain Rot" : "Tập trung tốt";

    // Hiển thị lên màn hình
    document.getElementById('final-stats').innerHTML = `
        <p>Đang gửi dữ liệu nghiên cứu...</p>
    `;

    // GỬI DỮ LIỆU LÊN DATABASE (Google Sheets)
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwrSFijRQtYcYB5qHT4mi0nthMQKuRafs-qAqb31Flq-ZnRwcQ7HevPJpNDrX4j2DY/exec';
    
    fetch(scriptURL, {
        method: 'POST',
        body: JSON.stringify({
            usage: usage,
            avgRT: avgRT.toFixed(0),
            accuracy: accuracy,
            advice: advice
        })
    })
    .then(response => {
        document.getElementById('final-stats').innerHTML = `
            <p>✅ Đã lưu dữ liệu thành công!</p>
            <p><b>Tốc độ phản xạ:</b> ${avgRT.toFixed(0)} ms</p>
            <p><b>Độ chính xác:</b> ${accuracy}%</p>
        `;
    })
    .catch(error => console.error('Lỗi!', error.message));
}
</script>
</body>
</html>
