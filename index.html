<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroScan AI - Expert Mode</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #6366f1; --bg: #020617; --glass: rgba(15, 23, 42, 0.95); }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        #app { width: 100%; max-width: 500px; padding: 30px; border-radius: 30px; background: var(--glass); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 25px 50px rgba(0,0,0,0.5); }

        /* MÀN HÌNH CHỜ Ý NGHĨA */
        .intro-card { background: rgba(99, 102, 241, 0.1); padding: 20px; border-radius: 20px; border-left: 4px solid var(--p); text-align: left; margin: 20px 0; }
        .intro-card p { font-size: 0.9rem; line-height: 1.6; margin: 0; opacity: 0.9; }

        /* CHATBOT AREA */
        .chat-box { height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 20px; margin: 15px 0; border: 1px solid rgba(255,255,255,0.05); }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 0.92rem; line-height: 1.5; }
        .bot { background: rgba(99, 102, 241, 0.15); border: 1px solid var(--p); align-self: flex-start; border-bottom-left-radius: 2px; }
        .user { background: var(--p); align-self: flex-end; border-bottom-right-radius: 2px; }

        .ai-label { font-size: 0.7rem; color: #fbbf24; font-weight: 800; display: block; margin-bottom: 5px; text-transform: uppercase; }
        .input-bar { display: flex; gap: 10px; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); }
        input { flex: 1; background: none; border: none; color: white; padding: 10px; outline: none; }
        
        .btn { width: 100%; padding: 18px; border-radius: 18px; border: none; background: var(--p); color: white; font-weight: 800; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="app">
    <div id="screen-intro">
        <h2 style="margin:0; letter-spacing: -1px;">NeuroScan AI</h2>
        <p style="font-size: 0.75rem; color: var(--p); font-weight: 800; margin-top: 5px;">NGHIÊN CỨU BRAIN ROT | KHÁNH HÒA</p>
        <div class="intro-card">
            <p id="intro-text">Đang phân tích mục tiêu nghiên cứu...</p>
        </div>
        <button class="btn" onclick="startSurvey()">BẮT ĐẦU CHẨN ĐOÁN</button>
    </div>

    <div id="screen-test" class="hidden">
        <div id="word" style="font-size: 4rem; font-weight: 900; margin: 40px 0; text-align: center;">---</div>
        <div id="options" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;"></div>
    </div>

    <div id="screen-ai" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <div style="text-align: left;"><h3 style="margin:0; font-size: 1.1rem;">Trợ lý Neuro-AI</h3><small style="color:#10b981">● Chuyên gia Thần kinh học</small></div>
            <div id="score-display" style="background:var(--p); padding: 5px 12px; border-radius: 10px; font-weight: 800; font-size: 0.8rem;">SCORE: 0%</div>
        </div>
        <div class="chat-box" id="chat-content"></div>
        <div class="input-bar">
            <input type="text" id="user-msg" placeholder="Hỏi AI về kết quả nhận thức của bạn...">
            <button onclick="askGemini()" style="background:var(--p); border:none; color:white; border-radius:10px; padding:0 15px; cursor:pointer; font-weight:bold;">GỬI</button>
        </div>
    </div>
</div>

<script>
    // 1. CHỮ CHẠY GIỚI THIỆU
    const facts = [
        "Nghiên cứu về sự suy giảm nhận thức do Video ngắn.",
        "Đo lường năng lực ức chế xung đột qua bài test thần kinh.",
        "Đề xuất giải pháp can thiệp thói quen số cho giới trẻ.",
        "Dữ liệu được bảo mật phục vụ mục đích khoa học."
    ];
    let fIdx = 0;
    function runIntro() {
        if(fIdx < facts.length) {
            document.getElementById('intro-text').innerText = "▹ " + facts[fIdx++];
            setTimeout(runIntro, 1800);
        }
    }
    runIntro();

    // 2. LOGIC TEST
    const colors = [{n:"ĐỎ",v:"#ff4757"}, {n:"XANH",v:"#2e86de"}, {n:"LÁ",v:"#2ecc71"}, {n:"VÀNG",v:"#ffa502"}];
    let results = [], current = 0, total = 10, startTime, finalScore = 0;

    function startSurvey() {
        document.getElementById('screen-intro').classList.add('hidden');
        document.getElementById('screen-test').classList.remove('hidden');
        next();
    }

    function next() {
        if(current >= total) { showAI(); return; }
        const tIdx = Math.floor(Math.random()*colors.length);
        let cIdx; do { cIdx = Math.floor(Math.random()*colors.length); } while(cIdx === tIdx);
        const d = document.getElementById('word'); d.innerText = colors[tIdx].n; d.style.color = colors[cIdx].v;
        const g = document.getElementById('options'); g.innerHTML = '';
        [...colors].sort(()=>Math.random()-0.5).forEach(c => {
            const b = document.createElement('button');
            b.style.padding = "20px"; b.style.borderRadius = "15px"; b.style.border = "none";
            b.style.background = "rgba(255,255,255,0.05)"; b.style.color = "white"; b.style.fontWeight = "800";
            b.innerText = c.n; b.onclick = () => { results.push({ok: c.v === colors[cIdx].v, rt: Date.now()-startTime}); current++; next(); };
            g.appendChild(b);
        });
        startTime = Date.now();
    }

    // 3. AI CHUYÊN GIA (CHỈ HIỆN SAU KHI TEST)
    function addChat(text, type, label = null) {
        const box = document.getElementById('chat-content');
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        if(label) div.innerHTML = `<span class="ai-label">${label}</span>${text}`;
        else div.innerText = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function showAI() {
        document.getElementById('screen-test').classList.add('hidden');
        document.getElementById('screen-ai').classList.remove('hidden');
        
        const avgRT = results.reduce((a,b)=>a+b.rt,0)/total;
        const acc = (results.filter(r=>r.ok).length/total)*100;
        finalScore = Math.min(100, Math.round((avgRT/25) + (100-acc) + 20));
        document.getElementById('score-display').innerText = `SCORE: ${finalScore}%`;

        addChat(`Phân tích hoàn tất. Chỉ số Brain Rot của Khôi là ${finalScore}%. Dựa trên phản xạ thực tế, bạn muốn tôi giải đáp sâu về khía cạnh nào?`, "bot", "CHẨN ĐOÁN THẦN KINH");
    }

    async function askGemini() {
        const inp = document.getElementById('user-msg');
        const q = inp.value; if(!q) return;
        addChat(q, "user"); inp.value = '';
        addChat("Đang phân tích câu hỏi qua Gemini AI...", "bot", "ĐANG XỬ LÝ");

        // --- ĐÂY LÀ NƠI GỌI API GEMINI THẬT ---
        // Khôi có thể dùng Google Apps Script làm trung gian để gọi Gemini API an toàn
        setTimeout(() => {
            document.getElementById('chat-content').lastChild.remove();
            const reply = getExpertReply(q, finalScore);
            addChat(reply.text, "bot", reply.tag);
        }, 1000);
    }

    function getExpertReply(q, s) {
        const query = q.toLowerCase();
        // Logic trả lời dựa trên Brain Score thực tế của người dùng
        if(query.includes("tại sao")) return { text: `Với mức Brain Score ${s}%, việc bạn bị chậm phản xạ là do Dopamine làm trơ thùy trán.`, tag: "CƠ CHẾ SINH LÝ" };
        return { text: "Đây là vấn đề cốt lõi trong nghiên cứu tại Lê Quý Đôn. Bạn có muốn biết phác đồ hồi phục không?", tag: "TƯ VẤN CHUYÊN SÂU" };
    }
</script>
</body>
</html>
