<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroScan AI | Lê Quý Đôn Specialized School</title>
    <style>
        /* SỬA LỖI FONT TUYỆT ĐỐI - Ưu tiên font hệ thống chuẩn tiếng Việt */
        :root { --p: #6366f1; --bg: #030712; --glass: rgba(17, 24, 39, 0.95); }
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg); color: white; margin: 0; 
            display: flex; align-items: center; justify-content: center; min-height: 100vh;
        }

        #app { width: 100%; max-width: 500px; padding: 30px; border-radius: 30px; background: var(--glass); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }

        /* MÀN HÌNH CHỜ Ý NGHĨA */
        .intro-box { text-align: left; background: rgba(0,0,0,0.3); padding: 20px; border-radius: 20px; border-left: 4px solid var(--p); margin: 20px 0; }
        .intro-box h4 { margin: 0 0 10px 0; color: var(--p); font-size: 0.9rem; text-transform: uppercase; }
        .intro-box p { font-size: 0.85rem; line-height: 1.6; color: rgba(255,255,255,0.7); }

        /* GIAO DIỆN CHAT CHUYÊN SÂU */
        .chat-window { height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 10px; margin-bottom: 20px; scroll-behavior: smooth; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 20px; font-size: 0.92rem; line-height: 1.5; }
        .bot { background: rgba(99, 102, 241, 0.1); border: 1px solid var(--p); align-self: flex-start; border-bottom-left-radius: 2px; }
        .user { background: var(--p); align-self: flex-end; border-bottom-right-radius: 2px; }
        
        .ai-status { font-size: 0.7rem; color: #fbbf24; font-weight: 800; margin-bottom: 4px; display: block; }

        .input-bar { display: flex; gap: 10px; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        input { flex: 1; background: none; border: none; color: white; padding: 10px; outline: none; }
        .btn { background: var(--p); border: none; border-radius: 15px; padding: 10px 20px; color: white; font-weight: 800; cursor: pointer; }

        .hidden { display: none; }
    </style>
</head>
<body>

<div id="app">
    <div id="screen-loading">
        <div style="font-size: 3rem; margin-bottom: 20px;">🧠</div>
        <h2 style="margin:0">NeuroScan AI</h2>
        <div class="intro-box">
            <h4>Mục tiêu nghiên cứu</h4>
            <p id="info-text">Đang tải cơ sở dữ liệu thần kinh học...</p>
        </div>
        <p style="font-size: 0.7rem; opacity: 0.4;">© 2025 Dự án Brain Rot | Khánh Hòa</p>
    </div>

    <div id="screen-chat" class="hidden">
        <div style="display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-bottom: 15px;">
            <div style="text-align: left;">
                <h3 style="margin:0; font-size: 1.1rem;">NeuroConsultant AI</h3>
                <small style="color: #10b981;">● Online (Expert Mode)</small>
            </div>
            <div id="score-badge" style="background: var(--p); padding: 5px 12px; border-radius: 10px; font-size: 0.8rem; font-weight: 800;">Score: 0%</div>
        </div>

        <div class="chat-window" id="chat-box"></div>

        <div class="input-bar">
            <input type="text" id="user-input" placeholder="Hỏi chuyên gia về tình trạng của bạn...">
            <button class="btn" onclick="handleChat()">GỬI</button>
        </div>
    </div>
</div>

<script>
    // 1. MÀN HÌNH CHỜ & KẾ HOẠCH NGHIÊN CỨU
    const researchSteps = [
        "Phân tích cơ chế Dopamine và vòng lặp gây nghiện của Video ngắn.",
        "Đánh giá sự sụt giảm tập trung (Attention Span) qua bài test Stroop.",
        "Kết nối dữ liệu thực nghiệm từ 200 học sinh tại Khánh Hòa.",
        "Thiết lập hệ thống chuyên gia tư vấn hồi phục nhận thức."
    ];
    let s = 0;
    function runIntro() {
        if(s < researchSteps.length) {
            document.getElementById('info-text').innerText = researchSteps[s++];
            setTimeout(runIntro, 1500);
        } else {
            document.getElementById('screen-loading').classList.add('hidden');
            document.getElementById('screen-chat').classList.remove('hidden');
            initChat();
        }
    }
    runIntro();

    // 2. HỆ THỐNG CHAT & KẾT NỐI AI
    const chatBox = document.getElementById('chat-box');

    function addMessage(text, type, status = null) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        if(status) div.innerHTML = `<span class="ai-status">${status}</span>${text}`;
        else div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function initChat() {
        addMessage("Chào bạn, tôi là NeuroConsultant. Sau khi phân tích hành vi của bạn, tôi thấy bạn đang ở mức độ 'Brain Rot' trung bình. Bạn cần tôi giải đáp sâu hơn về khía cạnh nào?", "bot", "PHÂN TÍCH TỔNG QUÁT");
    }

    async function handleChat() {
        const input = document.getElementById('user-input');
        const query = input.value;
        if(!query) return;

        addMessage(query, "user");
        input.value = '';

        // HIỆU ỨNG ĐANG SUY NGHĨ
        addMessage("...", "bot", "AI ĐANG PHÂN TÍCH CÂU HỎI");

        // --- ĐÂY LÀ NƠI KẾT NỐI BÊN THỨ 3 (DỰ PHÒNG CHUYÊN SÂU) ---
        // Nếu không có API thật, bot sẽ dùng Logic Expert local của chúng ta:
        const response = await getExpertResponse(query);
        
        // Xóa dấu ba chấm và hiện câu trả lời thật
        chatBox.lastChild.remove();
        addMessage(response.text, "bot", response.analysis);
    }

    // HÀM MÔ PHỎNG HỆ THỐNG CHUYÊN GIA (EXPERT SYSTEM)
    async function getExpertResponse(query) {
        const q = query.toLowerCase();
        
        // LOGIC CHUYÊN SÂU DỰA TRÊN BÁO CÁO CỦA KHÔI
        if(q.includes("dopamine") || q.includes("tại sao")) {
            return {
                text: "Video ngắn tạo ra các luồng Dopamine cường độ cao và ngắt quãng. Điều này khiến thụ thể Dopamine bị trơ, làm bạn mất khả năng tập trung vào các công việc 'chậm' như đọc sách hay học GPA.",
                analysis: "PHÂN TÍCH Y SINH HỌC"
            };
        }
        if(q.includes("hồi phục") || q.includes("cách làm")) {
            return {
                text: "Theo nghiên cứu của Khôi & Hoài Anh, giải pháp tốt nhất là Digital Detox 24-48h. Bạn cần ép não bộ quay lại trạng thái 'Default Mode Network' bằng cách đi bộ hoặc thiền định không dùng điện thoại.",
                analysis: "PHÁC ĐỒ CAN THIỆP"
            };
        }
        
        return {
            text: "Câu hỏi của bạn rất thực tế. Trong dự án tại Lê Quý Đôn, chúng tôi nhận thấy vấn đề này ảnh hưởng trực tiếp đến khả năng xử lý thông tin phức tạp. Bạn có muốn biết thêm về kỹ thuật Pomodoro để khắc phục không?",
            analysis: "KẾT QUẢ THỰC NGHIỆM"
        };
    }
</script>
</body>
</html>
