<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroScan | Dự án Nghiên cứu Brain Rot Lê Quý Đôn</title>
    <style>
        /* SỬA LỖI FONT: Dùng bảng mã font hệ thống an toàn nhất cho Tiếng Việt */
        :root { --p: #6366f1; --s: #a855f7; --bg: #030712; --glass: rgba(17, 24, 39, 0.95); }
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden;
        }
        #app { width: 100%; max-width: 500px; padding: 35px; border-radius: 40px; background: var(--glass); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 0 80px rgba(0,0,0,0.5); }

        /* MÀN HÌNH CHỜ Ý NGHĨA KHOA HỌC */
        .info-card { background: rgba(99, 102, 241, 0.1); padding: 20px; border-radius: 20px; border-left: 4px solid var(--p); text-align: left; margin: 20px 0; }
        .info-card p { font-size: 0.9rem; line-height: 1.6; color: rgba(255,255,255,0.8); margin: 0; }

        /* CHATBOT AREA - CHỈ HIỆN SAU KẾT QUẢ */
        .chat-box { height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 25px; margin: 20px 0; border: 1px solid rgba(255,255,255,0.05); }
        .msg { max-width: 85%; padding: 12px 18px; border-radius: 22px; font-size: 0.92rem; line-height: 1.5; text-align: left; }
        .bot { background: rgba(99, 102, 241, 0.15); border: 1px solid var(--p); align-self: flex-start; border-bottom-left-radius: 2px; }
        .user { background: var(--p); align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-label { font-size: 0.7rem; color: #fbbf24; font-weight: 800; display: block; margin-bottom: 5px; text-transform: uppercase; }

        .btn { width: 100%; padding: 18px; border-radius: 20px; border: none; background: var(--p); color: white; font-weight: 800; cursor: pointer; }
        .hidden { display: none; }
        input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; color: white; outline: none; }
    </style>
</head>
<body>

<div id="app">
    <div id="screen-intro">
        <h2 style="margin:0; letter-spacing:-1px;">NeuroScan Pro</h2>
        <p style="font-size: 0.75rem; color:var(--p); font-weight:800; margin-top:5px;">NGHIÊN CỨU BRAIN ROT | LÊ QUÝ ĐÔN</p>
        <div class="info-card">
            <p id="intro-text">Đang tải cơ sở dữ liệu nghiên cứu...</p>
        </div>
        <button class="btn" onclick="goToTest()">BẮT ĐẦU CHẨN ĐOÁN</button>
    </div>

    <div id="screen-test" class="hidden">
        <div style="font-size: 0.75rem; opacity: 0.5; margin-bottom: 20px;">CHỌN MÀU SẮC - BỎ QUA NỘI DUNG CHỮ</div>
        <div id="word" style="font-size: 4.5rem; font-weight: 900; margin: 40px 0;">---</div>
        <div id="options" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;"></div>
    </div>

    <div id="screen-ai" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <div style="text-align: left;"><h3 style="margin:0; font-size: 1.1rem;">Trợ lý Neuro-AI</h3><small style="color:#10b981">● Đang phân tích dữ liệu thần kinh</small></div>
            <div id="score-badge" style="background:var(--p); padding: 5px 12px; border-radius: 12px; font-weight: 800; font-size: 0.8rem;">SCORE: 0%</div>
        </div>
        <div class="chat-box" id="chat-content"></div>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="user-msg" placeholder="Đặt câu hỏi cho AI...">
            <button onclick="askExpertAI()" style="background:var(--p); border:none; color:white; border-radius:12px; padding:0 15px; cursor:pointer; font-weight:bold;">GỬI</button>
        </div>
    </div>
</div>

<script>
    // 1. CHẠY CHỮ GIỚI THIỆU (TRÍCH TỪ BÁO CÁO CỦA KHÔI)
    const researchInfo = [
        "Nghiên cứu về sự suy giảm nhận thức do tác động của MXH.",
        "Đo lường năng lực ức chế xung đột qua phản xạ Stroop.",
        "Đề xuất phác đồ hồi phục dựa trên nghiên cứu tại Khánh Hòa.",
        "Dữ liệu được xử lý bởi mô hình AI phân tích hành vi."
    ];
    let infoIdx = 0;
    function typeInfo() {
        if(infoIdx < researchInfo.length) {
            document.getElementById('intro-text').innerText = "▹ " + researchInfo[infoIdx++];
            setTimeout(typeInfo, 1600);
        }
    }
    typeInfo();

    // 2. LOGIC TEST
    const colors = [{n:"ĐỎ",v:"#ff4757"}, {n:"XANH",v:"#2e86de"}, {n:"LÁ",v:"#2ecc71"}, {n:"VÀNG",v:"#ffa502"}];
    let results = [], current = 0, total = 10, startTime, bScore = 0;

    function goToTest() {
        document.getElementById('screen-intro').classList.add('hidden');
        document.getElementById('screen-test').classList.remove('hidden');
        next();
    }

    function next() {
        if(current >= total) { initExpertChat(); return; }
        const tIdx = Math.floor(Math.random()*colors.length);
        let cIdx; do { cIdx = Math.floor(Math.random()*colors.length); } while(cIdx === tIdx);
        const d = document.getElementById('word'); d.innerText = colors[tIdx].n; d.style.color = colors[cIdx].v;
        const g = document.getElementById('options'); g.innerHTML = '';
        [...colors].sort(()=>Math.random()-0.5).forEach(c => {
            const b = document.createElement('button');
            b.style.padding = "20px"; b.style.borderRadius = "15px"; b.style.border = "none";
            b.style.background = "rgba(255,255,255,0.05)"; b.style.color = "white"; b.style.fontWeight = "800";
            b.innerText = c.n; b.onclick = () => { results.push({ok: c.v === colors[cIdx].v, rt: Date.now()-startTime}); current++; next(); };
            g.appendChild(b);
        });
        startTime = Date.now();
    }

    // 3. HỆ THỐNG AI CHUYÊN GIA
    function addChat(text, type, label = null) {
        const box = document.getElementById('chat-content');
        const div = document.createElement('div'); div.className = `msg ${type}`;
        if(label) div.innerHTML = `<span class="ai-label">🤖 ${label}</span>${text}`;
        else div.innerText = text;
        box.appendChild(div); box.scrollTop = box.scrollHeight;
    }

    function initExpertChat() {
        document.getElementById('screen-test').classList.add('hidden');
        document.getElementById('screen-ai').classList.remove('hidden');
        const avgRT = results.reduce((a,b)=>a+b.rt,0)/total;
        const acc = (results.filter(r=>r.ok).length/total)*100;
        bScore = Math.min(100, Math.round((avgRT/25) + (100-acc) + 20));
        document.getElementById('score-badge').innerText = `SCORE: ${bScore}%`;
        
        addChat(`Chào Khôi! Kết quả chẩn đoán: Brain Score ${bScore}%. Với tốc độ phản xạ ${avgRT.toFixed(0)}ms, tôi phát hiện thùy trán của bạn đang bị bão hòa Dopamine. Bạn cần tôi tư vấn giải pháp nào?`, "bot", "CHẨN ĐOÁN THẦN KINH");
    }

    function askExpertAI() {
        const inp = document.getElementById('user-msg'); const q = inp.value.toLowerCase();
        if(!q) return; addChat(inp.value, "user"); inp.value = '';

        let reply = "Đây là khía cạnh quan trọng trong dự án KHKT của bạn. Nghiên cứu tại Lê Quý Đôn cho thấy điều này liên quan mật thiết đến sự suy giảm GPA.";
        let tag = "KẾT QUẢ THỰC NGHIỆM";

        if(q.includes("dopamine") || q.includes("tại sao")) {
            reply = "Do video ngắn tạo ra kích thích Dopamine liên tục, làm trơ các thụ thể nhận tin, khiến não khó tập trung vào thông tin sâu.";
            tag = "SINH LÝ HỌC THẦN KINH";
        } else if(q.includes("hồi phục") || q.includes("cách")) {
            reply = "Khôi nên thực hiện Digital Detox 24h và rèn luyện đọc sách giấy để tái cấu trúc lại mạng lưới neuron tập trung.";
            tag = "PHÁC ĐỒ ĐIỀU TRỊ";
        }
        setTimeout(() => addChat(reply, "bot", tag), 600);
    }
</script>
</body>
</html>
