<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroScan AI | Expert System</title>
    <style>
        /* FIX FONT TUYỆT ĐỐI - Dùng font hệ thống chuẩn tiếng Việt */
        :root { --p: #6366f1; --bg: #030712; --glass: rgba(17, 24, 39, 0.95); }
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        #app { width: 100%; max-width: 500px; padding: 30px; border-radius: 35px; background: var(--glass); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.1); }

        /* MÀN HÌNH CHỜ Ý NGHĨA KHOA HỌC */
        .info-card { background: rgba(99, 102, 241, 0.1); padding: 20px; border-radius: 20px; border-left: 4px solid var(--p); text-align: left; margin: 20px 0; }
        .info-card p { font-size: 0.85rem; line-height: 1.6; color: rgba(255,255,255,0.8); margin: 0; }

        /* GIAO DIỆN CHATBOT CHUYÊN SÂU */
        .chat-box { height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 25px; margin: 15px 0; border: 1px solid rgba(255,255,255,0.05); }
        .msg { max-width: 85%; padding: 12px 18px; border-radius: 22px; font-size: 0.92rem; line-height: 1.5; text-align: left; }
        .bot { background: rgba(99, 102, 241, 0.15); border: 1px solid var(--p); align-self: flex-start; border-bottom-left-radius: 2px; }
        .user { background: var(--p); align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-label { font-size: 0.7rem; color: #fbbf24; font-weight: 800; display: block; margin-bottom: 5px; text-transform: uppercase; }

        .input-bar { display: flex; gap: 10px; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); }
        input { flex: 1; background: none; border: none; color: white; padding: 10px; outline: none; }
        .btn { background: var(--p); border: none; border-radius: 12px; padding: 10px 20px; color: white; font-weight: 800; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="app">
    <div id="screen-intro">
        <h2 style="margin:0; letter-spacing:-1px;">NeuroScan AI Pro</h2>
        <p style="font-size: 0.75rem; color:var(--p); font-weight:800; margin-top:5px;">HỆ THỐNG CHẨN ĐOÁN BRAIN ROT | LÊ QUÝ ĐÔN</p>
        <div class="info-card">
            <p id="intro-text">Đang tải kiến thức nghiên cứu...</p>
        </div>
        <button class="btn" onclick="startSurvey()">BẮT ĐẦU CHẨN ĐOÁN</button>
    </div>

    <div id="screen-test" class="hidden">
        <div id="word" style="font-size: 4.5rem; font-weight: 900; margin: 40px 0;">---</div>
        <div id="options" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;"></div>
    </div>

    <div id="screen-ai" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <div style="text-align: left;"><h3 style="margin:0; font-size: 1.1rem;">Chuyên gia Neuro-AI</h3><small style="color:#10b981">● Powered by Gemini Pro</small></div>
            <div id="score-badge" style="background:var(--p); padding: 5px 12px; border-radius: 12px; font-weight: 800; font-size: 0.8rem;">SCORE: 0%</div>
        </div>
        <div class="chat-box" id="chat-content"></div>
        <div class="input-bar">
            <input type="text" id="user-msg" placeholder="Hỏi AI về kết quả nhận thức của bạn...">
            <button onclick="askGemini()" class="btn">GỬI</button>
        </div>
    </div>
</div>

<script>
    const researchInfo = [
        "Phân tích sự suy giảm nhận thức do Video ngắn (TikTok/Reels).",
        "Đo lường năng lực thùy trán qua phản xạ Stroop thần kinh.",
        "Dữ liệu được xử lý bởi mô hình ngôn ngữ lớn (LLM).",
        "Dự án bởi Lưu Minh Khôi & Lê Hoài Anh - Khánh Hòa."
    ];
    let infoIdx = 0;
    function typeInfo() {
        if(infoIdx < researchInfo.length) {
            document.getElementById('intro-text').innerText = "▹ " + researchInfo[infoIdx++];
            setTimeout(typeInfo, 1600);
        }
    }
    typeInfo();

    const colors = [{n:"ĐỎ",v:"#ff4757"}, {n:"XANH",v:"#2e86de"}, {n:"LÁ",v:"#2ecc71"}, {n:"VÀNG",v:"#ffa502"}];
    let results = [], current = 0, total = 10, startTime, bScore = 0;

    function startSurvey() {
        document.getElementById('screen-intro').classList.add('hidden');
        document.getElementById('screen-test').classList.remove('hidden');
        next();
    }

    function next() {
        if(current >= total) { initAIChat(); return; }
        const tIdx = Math.floor(Math.random()*colors.length);
        let cIdx; do { cIdx = Math.floor(Math.random()*colors.length); } while(cIdx === tIdx);
        const d = document.getElementById('word'); d.innerText = colors[tIdx].n; d.style.color = colors[cIdx].v;
        const g = document.getElementById('options'); g.innerHTML = '';
        [...colors].sort(()=>Math.random()-0.5).forEach(c => {
            const b = document.createElement('button');
            b.style.padding = "20px"; b.style.borderRadius = "15px"; b.style.border = "none";
            b.style.background = "rgba(255,255,255,0.05)"; b.style.color = "white"; b.style.fontWeight = "800";
            b.innerText = c.n; b.onclick = () => { results.push({ok: c.v === colors[cIdx].v, rt: Date.now()-startTime}); current++; next(); };
            g.appendChild(b);
        });
        startTime = Date.now();
    }

    function addChat(text, type, label = null) {
        const box = document.getElementById('chat-content');
        const div = document.createElement('div'); div.className = `msg ${type}`;
        if(label) div.innerHTML = `<span class="ai-label">🤖 ${label}</span>${text}`;
        else div.innerText = text;
        box.appendChild(div); box.scrollTop = box.scrollHeight;
    }

    function initAIChat() {
        document.getElementById('screen-test').classList.add('hidden');
        document.getElementById('screen-ai').classList.remove('hidden');
        const avgRT = results.reduce((a,b)=>a+b.rt,0)/total;
        const acc = (results.filter(r=>r.ok).length/total)*100;
        bScore = Math.min(100, Math.round((avgRT/25) + (100-acc) + 20));
        document.getElementById('score-badge').innerText = `SCORE: ${bScore}%`;
        addChat(`Chào Khôi! Kết quả test Stroop của bạn là ${bScore}%. Phản xạ đạt ${avgRT.toFixed(0)}ms. Bạn cần tôi phân tích sâu hơn về khía cạnh nào?`, "bot", "CHẨN ĐOÁN HÀNH VI");
    }

    async function askGemini() {
        const inp = document.getElementById('user-msg');
        const query = inp.value; if(!query) return;
        addChat(query, "user"); inp.value = '';
        addChat("Đang kết nối API Gemini để phân tích câu hỏi...", "bot", "HỆ THỐNG ĐANG SUY NGHĨ");

        // --- MÔ PHỎNG KẾT NỐI API BÊN THỨ 3 ---
        // Khôi có thể thay phần này bằng fetch tới Apps Script để gọi Gemini thật
        setTimeout(() => {
            document.getElementById('chat-content').lastChild.remove();
            const reply = getAIPoweredResponse(query, bScore);
            addChat(reply.text, "bot", reply.tag);
        }, 1200);
    }

    function getAIPoweredResponse(q, s) {
        q = q.toLowerCase();
        // Logic thông minh dựa trên ngữ cảnh nghiên cứu
        if(q.includes("tại sao") || q.includes("dopamine")) return { text: `Với Brain Score ${s}%, các thụ thể Dopamine của bạn đang có dấu hiệu bị trơ do video ngắn, khiến thùy trán khó kiểm soát được sự tập trung.`, tag: "PHÂN TÍCH Y SINH" };
        if(q.includes("hồi phục") || q.includes("cách")) return { text: "Tôi đề xuất bạn thực hiện Digital Detox 24h và áp dụng Pomodoro để tái cấu trúc lại mạng lưới neuron tập trung.", tag: "PHÁC ĐỒ ĐIỀU TRỊ" };
        return { text: "Câu hỏi này rất sâu sắc. Theo dữ liệu 200 học sinh Khánh Hòa, điều này ảnh hưởng trực tiếp đến kết quả học tập GPA.", tag: "DỮ LIỆU THỰC NGHIỆM" };
    }
</script>
</body>
</html>
