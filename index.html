<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroScan AI | Chuyên gia Phân tích Nhận thức</title>
    <style>
        :root { --p: #6366f1; --s: #a855f7; --bg: #030712; --glass: rgba(17, 24, 39, 0.95); }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: white; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        
        #app { width: 100%; max-width: 550px; padding: 35px; border-radius: 35px; background: var(--glass); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        
        /* Chat Engine UI */
        .chat-window { height: 400px; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 25px; padding: 20px; margin: 20px 0; display: flex; flex-direction: column; gap: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .msg { max-width: 85%; padding: 14px 18px; border-radius: 20px; font-size: 0.92rem; line-height: 1.5; position: relative; }
        .bot { background: linear-gradient(135deg, var(--p), var(--s)); align-self: flex-start; border-bottom-left-radius: 4px; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2); }
        .user { background: rgba(255,255,255,0.1); align-self: flex-end; border-bottom-right-radius: 4px; }
        
        .analysis-tag { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; color: #fbbf24; margin-bottom: 5px; display: block; }

        .input-group { display: flex; gap: 10px; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        input { flex: 1; background: none; border: none; color: white; padding: 10px 15px; outline: none; font-size: 0.9rem; }
        .send-btn { background: var(--p); border: none; border-radius: 15px; padding: 10px 20px; color: white; font-weight: 800; cursor: pointer; }

        .suggest-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; }
        .chip { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 20px; font-size: 0.75rem; cursor: pointer; white-space: nowrap; }
        .chip:hover { border-color: var(--p); background: rgba(99, 102, 241, 0.1); }

        .hidden { display: none; }
        .btn-prime { width: 100%; padding: 18px; border-radius: 20px; border: none; background: var(--p); color: white; font-weight: 800; cursor: pointer; font-size: 1rem; }
    </style>
</head>
<body>

<div id="app">
    <div id="screen-start">
        <h2 style="margin:0">NeuroScan Pro</h2>
        <p style="opacity: 0.5; font-size: 0.8rem; margin-bottom: 30px;">HỆ THỐNG PHÂN TÍCH NHẬN THỨC BỞI LMK & LHA</p>
        <div style="text-align: left; margin-bottom: 20px;">
            <label style="font-size: 0.8rem; opacity: 0.6;">Thời gian dùng Video ngắn (giờ/ngày):</label>
            <input type="range" id="usage" min="0" max="10" value="3" style="width:100%; margin-top:10px;">
            <div style="text-align: right; font-weight: 800; color: var(--p);"><span id="u-val">3</span>h</div>
        </div>
        <button class="btn-prime" onclick="startNeuroTest()">BẮT ĐẦU PHÂN TÍCH</button>
    </div>

    <div id="screen-test" class="hidden">
        <div id="word" style="font-size: 4rem; font-weight: 900; margin: 40px 0; text-align: center;">---</div>
        <div id="options" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;"></div>
    </div>

    <div id="screen-chat" class="hidden">
        <div id="score-banner" style="background: rgba(99, 102, 241, 0.1); padding: 15px; border-radius: 15px; border-left: 5px solid var(--p); text-align: left;">
            <span style="font-size: 0.75rem; font-weight: 800; opacity: 0.6;">BRAIN ROT INDEX</span>
            <div id="final-score" style="font-size: 1.5rem; font-weight: 900; color: var(--p);">0%</div>
        </div>

        <div class="chat-window" id="chat-box"></div>

        <div class="suggest-chips" id="chips"></div>

        <div class="input-group">
            <input type="text" id="user-input" placeholder="Hỏi tôi về tình trạng của bạn...">
            <button class="send-btn" onclick="handleChat()">GỬI</button>
        </div>
    </div>
</div>

<script>
    const colors = [{n:"ĐỎ",v:"#ff4757"}, {n:"XANH",v:"#2e86de"}, {n:"LÁ",v:"#2ecc71"}, {n:"VÀNG",v:"#ffa502"}];
    let results = [], current = 0, total = 10, startTime, brainScore = 0;

    document.getElementById('usage').oninput = function() { document.getElementById('u-val').innerText = this.value; }

    function startNeuroTest() {
        document.getElementById('screen-start').classList.add('hidden');
        document.getElementById('screen-test').classList.remove('hidden');
        nextTrial();
    }

    function nextTrial() {
        if(current >= total) { finalize(); return; }
        const tIdx = Math.floor(Math.random()*colors.length);
        let cIdx; do { cIdx = Math.floor(Math.random()*colors.length); } while(cIdx === tIdx);
        const d = document.getElementById('word');
        d.innerText = colors[tIdx].n; d.style.color = colors[cIdx].v;
        const g = document.getElementById('options'); g.innerHTML = '';
        [...colors].sort(()=>Math.random()-0.5).forEach(c => {
            const b = document.createElement('button');
            b.style.padding = "18px"; b.style.borderRadius = "15px"; b.style.border = "none";
            b.style.background = "rgba(255,255,255,0.05)"; b.style.color = "white"; b.style.fontWeight = "800";
            b.innerText = c.n;
            b.onclick = () => { results.push({ok: c.v === colors[cIdx].v, rt: Date.now()-startTime}); current++; nextTrial(); };
            g.appendChild(b);
        });
        startTime = Date.now();
    }

    // --- BỘ NÃO PHÂN TÍCH CỦA BOT ---
    function addMsg(text, type, analysis = null) {
        const box = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        if(analysis) div.innerHTML = `<span class="analysis-tag">🤖 Phân tích tư duy: ${analysis}</span>${text}`;
        else div.innerText = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    const aiLogic = {
        "mệt mỏi": { ans: "Đó là dấu hiệu của 'Sự kiệt sức Dopamine'. Não bạn đã quen với cường độ kích thích cao.", ana: "Người dùng đang cảm nhận sự sụt giảm năng lượng tinh thần." },
        "tập trung": { ans: "Khả năng tập trung sâu (Deep Work) bị hủy hoại bởi các video 15 giây. Hãy thử Pomodoro.", ana: "Người dùng quan tâm đến việc phục hồi chức năng điều hành." },
        "tại sao": { ans: "Vì thuật toán MXH thiết kế để tối ưu hóa sự chú ý của bạn, khiến não luôn ở trạng thái 'săn lùng' dopamine.", ana: "Người dùng đang tìm kiếm nguyên nhân gốc rễ của hành vi." }
    };

    function finalize() {
        document.getElementById('screen-test').classList.add('hidden');
        document.getElementById('screen-chat').classList.remove('hidden');

        const avgRT = results.reduce((a,b)=>a+b.rt,0)/total;
        const acc = (results.filter(r=>r.ok).length/total)*100;
        const use = document.getElementById('usage').value;

        brainScore = Math.min(100, Math.round((use * 7) + (avgRT/25) + (100-acc)));
        document.getElementById('final-score').innerText = brainScore + "%";

        addMsg(`Chào Khôi! Phân tích xong. Chỉ số Brain Rot của bạn là ${brainScore}%.`, 'bot');
        
        if(brainScore > 50) {
            addMsg("Dựa trên phản xạ, bạn đang gặp khó khăn trong việc ức chế xung đột. Bạn cảm thấy thế nào?", 'bot', "Phát hiện dấu hiệu suy giảm kiểm soát hành vi.");
            showChips(["Tại sao tôi bị vậy?", "Tôi thấy mệt mỏi", "Cách tập trung lại?"]);
        } else {
            addMsg("Bạn có bộ não khá 'sạch'. Bạn muốn biết cách bảo vệ nó không?", 'bot', "Người dùng có nền tảng nhận thức ổn định.");
            showChips(["Dopamine là gì?", "Cách đọc sách sâu"]);
        }
    }

    function showChips(list) {
        const c = document.getElementById('chips');
        c.innerHTML = '';
        list.forEach(item => {
            const div = document.createElement('div');
            div.className = 'chip';
            div.innerText = item;
            div.onclick = () => { addMsg(item, 'user'); processResponse(item); };
            c.appendChild(div);
        });
    }

    function processResponse(input) {
        const text = input.toLowerCase();
        let found = false;
        
        for (let key in aiLogic) {
            if (text.includes(key)) {
                setTimeout(() => addMsg(aiLogic[key].ans, 'bot', aiLogic[key].ana), 600);
                found = true; break;
            }
        }
        
        if(!found) setTimeout(() => addMsg("Câu hỏi này cho thấy bạn đang tò mò về cơ chế thần kinh. Tôi sẽ lưu dữ liệu này để nghiên cứu thêm!", 'bot', "Phát hiện nhu cầu tìm kiếm thông tin mới."), 600);
    }

    function handleChat() {
        const inp = document.getElementById('user-input');
        if(!inp.value) return;
        addMsg(inp.value, 'user');
        processResponse(inp.value);
        inp.value = '';
    }
</script>
</body>
</html>
