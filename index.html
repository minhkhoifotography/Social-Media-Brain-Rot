<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroAssistant v2.0 | AI Diagnostic</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --bg: #0b0f1a; --card: rgba(23, 31, 50, 0.8); }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden; }
        #app { width: 100%; max-width: 500px; padding: 40px; border-radius: 32px; background: var(--card); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); position: relative; }
        
        /* Assistant Avatar */
        .avatar-cpu { width: 60px; height: 60px; background: linear-gradient(135deg, var(--primary), #a855f7); border-radius: 50%; margin: 0 auto 20px; box-shadow: 0 0 20px var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }

        .chat-bubble { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px 15px 15px 0; margin-bottom: 25px; font-size: 0.95rem; line-height: 1.5; border-left: 3px solid var(--primary); }
        .slider-box { background: rgba(255,255,255,0.03); padding: 20px; border-radius: 20px; margin-bottom: 15px; }
        .btn-action { width: 100%; padding: 16px; border-radius: 16px; border: none; background: var(--primary); color: white; font-weight: 700; cursor: pointer; margin-top: 20px; }
        
        /* Test Area */
        .word-display { font-size: 4rem; font-weight: 800; margin: 30px 0; min-height: 100px; }
        .grid-answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .ans-btn { padding: 18px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); background: none; color: white; font-weight: 700; cursor: pointer; }

        /* Prescription Card (Thẻ giải pháp) */
        .rx-card { background: linear-gradient(135deg, rgba(99,102,241,0.1), rgba(168,85,247,0.1)); border: 1px dashed var(--primary); padding: 20px; border-radius: 20px; margin-top: 20px; text-align: left; }
        .rx-title { color: var(--primary); font-weight: 800; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 10px; display: block; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="app">
    <div class="avatar-cpu">🤖</div>
    
    <div id="screen-diag">
        <div class="chat-bubble" id="ai-text">Chào Khôi! Tôi là trợ lý Neuro-AI. Hãy để tôi thăm khám mức độ "Brain Rot" của bạn qua một vài chỉ số nhé.</div>
        
        <div class="slider-box">
            <small>Thời gian dùng Reels/TikTok hàng ngày:</small>
            <input type="range" id="usage" min="0" max="10" step="1" value="2" style="width:100%; accent-color: #6366f1;">
            <div style="text-align: right;"><span id="u-val">2</span>h</div>
        </div>

        <button class="btn-action" onclick="startTest()">BẮT ĐẦU KIỂM TRA NÃO BỘ</button>
    </div>

    <div id="screen-test" class="hidden">
        <div class="chat-bubble">Tập trung! Chỉ chọn <b>MÀU SẮC</b> của chữ nhé...</div>
        <div id="word" class="word-display">---</div>
        <div class="grid-answers" id="answers"></div>
    </div>

    <div id="screen-result" class="hidden">
        <div class="chat-bubble" id="diagnosis-text">Đang phân tích dữ liệu thần kinh...</div>
        
        <div class="rx-card" id="prescription">
            <span class="rx-title">📋 LỘ TRÌNH HỒI PHỤC</span>
            <div id="rx-content" style="font-size: 0.85rem; opacity: 0.9;"></div>
        </div>
        
        <button class="btn-action" onclick="location.reload()" style="background: rgba(255,255,255,0.05);">THOÁT TRỢ LÝ</button>
    </div>
</div>

<script>
    const colors = [{n:"ĐỎ",v:"#ff4757"}, {n:"XANH",v:"#2e86de"}, {n:"LÁ",v:"#2ecc71"}, {n:"VÀNG",v:"#ffa502"}];
    let results = [], current = 0, total = 12, startTime;

    document.getElementById('usage').oninput = function() { document.getElementById('u-val').innerText = this.value; }

    function startTest() {
        document.getElementById('screen-diag').classList.add('hidden');
        document.getElementById('screen-test').classList.remove('hidden');
        next();
    }

    function next() {
        if(current >= total) { showResult(); return; }
        const tIdx = Math.floor(Math.random()*colors.length);
        let cIdx; do { cIdx = Math.floor(Math.random()*colors.length); } while(cIdx === tIdx);
        
        const d = document.getElementById('word');
        d.innerText = colors[tIdx].n; d.style.color = colors[cIdx].v;

        const g = document.getElementById('answers'); g.innerHTML = '';
        [...colors].sort(()=>Math.random()-0.5).forEach(c => {
            const b = document.createElement('button');
            b.className = 'ans-btn'; b.innerText = c.n;
            b.onclick = () => { results.push({ok: c.v === colors[cIdx].v, rt: Date.now()-startTime}); current++; next(); };
            g.appendChild(b);
        });
        startTime = Date.now();
    }

    async function showResult() {
        document.getElementById('screen-test').classList.add('hidden');
        document.getElementById('screen-result').classList.remove('hidden');

        const avgRT = results.reduce((a,b)=>a+b.rt,0)/total;
        const acc = (results.filter(r=>r.ok).length/total)*100;
        const use = document.getElementById('usage').value;

        let diag = "", rx = "";

        if (use > 4 && avgRT > 900) {
            diag = "Kết quả thăm khám: Bạn đang ở trạng thái <b>'Brain Rot' giai đoạn 2</b>. Não bộ bị bão hòa Dopamine khiến phản xạ trì trệ.";
            rx = "• Thực hiện 'Dopamine Detox' 24h.<br>• Xóa TikTok/Reels trong 3 ngày.<br>• Đọc sách giấy 15 phút trước khi ngủ.";
        } else if (acc < 70) {
            diag = "Chẩn đoán: <b>Hội chứng Nhận thức bốc đồng</b>. Bạn phản ứng nhanh nhưng thiếu sự kiểm soát sâu.";
            rx = "• Thực hành thiền định (Mindfulness) 5p mỗi ngày.<br>• Chơi các trò chơi tư duy logic (Sudoku, Cờ vua).<br>• Tắt thông báo điện thoại khi học tập.";
        } else {
            diag = "Chúc mừng! <b>Chỉ số nhận thức của bạn rất tốt</b>. Não bộ duy trì được sự minh mẫn bất chấp tác động của môi trường số.";
            rx = "• Tiếp tục duy trì thói quen hiện tại.<br>• Thử thách não bộ với các ngôn ngữ mới (English/C++).";
        }

        document.getElementById('diagnosis-text').innerHTML = diag;
        document.getElementById('rx-content').innerHTML = rx;

        // Gửi data về Google Sheets
        fetch('URL_CỦA_KHÔI', {
            method: 'POST',
            body: JSON.stringify({ usage: use, avgRT: avgRT.toFixed(0), accuracy: acc, advice: diag })
        });
    }
</script>
</body>
</html>
